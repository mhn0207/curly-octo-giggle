# Prometheus 配置文件 — 知应 AI｜多 Agent 智能客服平台

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zhiying'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # 知应 AI 主应用指标
  - job_name: 'zhiying-app'
    static_configs:
      - targets: ['zhiying:8000']
        labels:
          service: 'zhiying'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
