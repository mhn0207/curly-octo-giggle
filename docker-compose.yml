# 知应 AI｜多 Agent 智能客服平台 — Docker Compose 服务编排
# 三级记忆架构：Redis（工作记忆）+ ChromaDB（情景记忆 + 用户画像）

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zhiying-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-zhiying123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zhiying123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: zhiying-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: zhiying-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── 知应 AI 主应用 ─────────────────────────────────────────────────────────
  zhiying:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zhiying-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-zhiying123}@redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - ZHIYING_SKILLS_DIR=/app/skills
      # LangChain 改造默认关闭，可通过 .env 独立灰度和回滚。
      - ZHIYING_AGENT_TOOL_CALLING=${ZHIYING_AGENT_TOOL_CALLING:-true}
      - ZHIYING_AGENT_MAX_TOOL_STEPS=${ZHIYING_AGENT_MAX_TOOL_STEPS:-4}
      - ZHIYING_AGENT_REQUEST_TIMEOUT=${ZHIYING_AGENT_REQUEST_TIMEOUT:-60}
      - ZHIYING_LANGCHAIN_STRUCTURED_OUTPUT=${ZHIYING_LANGCHAIN_STRUCTURED_OUTPUT:-false}
      - ZHIYING_STRUCTURED_OUTPUT_MODE=${ZHIYING_STRUCTURED_OUTPUT_MODE:-tool}
      - ZHIYING_STRUCTURED_OUTPUT_FALLBACK=${ZHIYING_STRUCTURED_OUTPUT_FALLBACK:-true}
      - ZHIYING_STRUCTURED_OUTPUT_SHADOW=${ZHIYING_STRUCTURED_OUTPUT_SHADOW:-false}
      - ZHIYING_LANGCHAIN_RAG=${ZHIYING_LANGCHAIN_RAG:-false}
      - ZHIYING_RAG_ROLLOUT_MODE=${ZHIYING_RAG_ROLLOUT_MODE:-}
      - ZHIYING_RAG_CANARY_PERCENT=${ZHIYING_RAG_CANARY_PERCENT:-0}
      - ZHIYING_KB_COLLECTION=${ZHIYING_KB_COLLECTION:-knowledge_base_langchain}
      - ZHIYING_EMBEDDING_PROVIDER=${ZHIYING_EMBEDDING_PROVIDER:-chroma_default}
      - ZHIYING_EMBEDDING_MODEL=${ZHIYING_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - ZHIYING_EMBEDDING_DIMENSIONS=${ZHIYING_EMBEDDING_DIMENSIONS:-384}
      - ZHIYING_EMBEDDING_CACHE_DIR=${ZHIYING_EMBEDDING_CACHE_DIR:-/app/data/chroma/embedding-cache}
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/eval:/app/data/eval
      - ./skills:/app/skills
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 知应 AI Vue 前端 ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhiying-frontend
    ports:
      - "5174:80"
    environment:
      - ZHIYING_API_UPSTREAM=zhiying:8000
      - NGINX_ENVSUBST_FILTER=ZHIYING_API_UPSTREAM
    depends_on:
      zhiying:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx 反向代理 ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: zhiying-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      zhiying:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zhiying-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  zhiying-network:
    driver: bridge
# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
